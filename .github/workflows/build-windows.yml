name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'

      - name: Configure CMake
        run: cmake -B build -S cashRegisterSystem

      - name: Build
        run: cmake --build build --config Release

      - name: Copy MSVC Runtime DLLs
        shell: cmd
        run: |
          for /f "tokens=*" %%i in ('vswhere -latest -find "VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT\MSVCP140.dll"') do copy "%%i" build\Release\
          for /f "tokens=*" %%i in ('vswhere -latest -find "VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT\MSVCP140_1.dll"') do copy "%%i" build\Release\
          for /f "tokens=*" %%i in ('vswhere -latest -find "VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT\VCRUNTIME140.dll"') do copy "%%i" build\Release\
          for /f "tokens=*" %%i in ('vswhere -latest -find "VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT\VCRUNTIME140_1.dll"') do copy "%%i" build\Release\

      - name: Deploy Qt DLLs
        shell: cmd
        run: windeployqt build\Release\cashRegisterSystem.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cashRegisterSystem-windows
          path: build/Release/
